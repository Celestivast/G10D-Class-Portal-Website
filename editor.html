<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>武汉爱莎 · 内容文件编辑器</title><link rel="stylesheet" href="/account.css"><style>main{max-width:1060px}.editor-grid{display:grid;grid-template-columns:240px 1fr;gap:28px}select,textarea{width:100%;padding:10px;border:1px solid #cbd4db;border-radius:7px;font:inherit;color:#24384a;margin-top:8px}textarea{min-height:110px}#list{display:grid;gap:6px;max-height:600px;overflow:auto;margin-top:12px}#list button{text-align:left;border:1px solid #e0e5e8;background:#f8f9f8;padding:10px;border-radius:7px;color:#24384a;overflow-wrap:anywhere}#list button.selected{background:#2a3f54;color:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.check{display:flex;gap:8px}.check input{width:auto;margin:0}#status{position:sticky;top:0;background:#edf3f5;padding:10px;z-index:1}.small{font-size:11px}@media(max-width:650px){.editor-grid{grid-template-columns:1fr}#list{max-height:180px}}</style></head><body><header><a href="/"><img src="/isa-logo.png" alt="武汉爱莎"><b>G10-D</b></a></header><main><span class="eyebrow">CONTENT WORKSHOP</span><h1>内容文件编辑器</h1><p>这里只修改当前浏览器中的草稿，不会修改线上网站。完成后下载 content.json，用它替换部署文件里的同名文件，再重新部署。照片、课件请放进 media / files 文件夹。</p><p id="status" role="status">正在读取内容…</p><div class="row"><label>导入已有 content.json<input id="import" type="file" accept=".json"></label><button id="export" class="primary">下载完整 content.json</button></div><div class="editor-grid"><aside><label>栏目<select id="kind"></select></label><button id="add" class="secondary">新增内容</button><div id="list"></div></aside><section><form id="form"></form><div class="row"><button id="apply" class="primary">保存到当前草稿</button><button id="remove" class="secondary">从草稿删除</button></div></section></div><p class="note">这是公开的离线编辑工具，不是管理权限入口。其他人打开此页也只能下载自己的草稿，无法修改网站。只有拥有代码仓库或部署账号权限的人可以正式发布。不要将反馈、账号或任何私密资料加入公开内容文件。</p><a href="/">返回首页</a></main><script type="module" src="/editor.js"></script></body></html>
